
<style>
  .anim-wrap { display: flex; justify-content: center; align-items: center; padding: 2rem 0; }

  @keyframes headBob {
    0%, 100% { transform: rotate(0deg); }
    25% { transform: rotate(-1.5deg) translateY(-1px); }
    75% { transform: rotate(1.2deg) translateY(1px); }
  }
  @keyframes blink {
    0%, 92%, 100% { transform: scaleY(1); }
    95% { transform: scaleY(0.08); }
  }
  @keyframes armType {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    30% { transform: translateY(-3px) rotate(-1.5deg); }
    60% { transform: translateY(2px) rotate(1deg); }
  }
  @keyframes armTypeLeft {
    0%, 100% { transform: translateY(0px) rotate(0deg); }
    20% { transform: translateY(2px) rotate(0.8deg); }
    55% { transform: translateY(-2.5px) rotate(-1.2deg); }
    80% { transform: translateY(1px) rotate(0.5deg); }
  }
  @keyframes smoke1 {
    0% { transform: translateY(0) scaleX(1); opacity: 0.7; }
    50% { transform: translateY(-18px) scaleX(1.3) translateX(2px); opacity: 0.4; }
    100% { transform: translateY(-35px) scaleX(0.6) translateX(-2px); opacity: 0; }
  }
  @keyframes smoke2 {
    0% { transform: translateY(0) scaleX(1); opacity: 0.5; }
    50% { transform: translateY(-22px) scaleX(1.1) translateX(-3px); opacity: 0.3; }
    100% { transform: translateY(-40px) scaleX(0.7) translateX(3px); opacity: 0; }
  }
  @keyframes smoke3 {
    0% { transform: translateY(0) scaleX(1); opacity: 0.6; }
    50% { transform: translateY(-15px) scaleX(1.4) translateX(4px); opacity: 0.35; }
    100% { transform: translateY(-32px) scaleX(0.5) translateX(-3px); opacity: 0; }
  }
  @keyframes breathe {
    0%, 100% { transform: scaleY(1) translateY(0); }
    50% { transform: scaleY(1.008) translateY(-1px); }
  }
  @keyframes expression {
    0%, 30%, 100% { opacity: 1; }
    35%, 65% { opacity: 0; }
  }
  @keyframes expressionSmile {
    0%, 30% { opacity: 0; }
    35%, 65% { opacity: 1; }
    70%, 100% { opacity: 0; }
  }

  #head-group {
    transform-origin: 210px 105px;
    animation: headBob 3.8s ease-in-out infinite;
  }
  #eyes-group {
    transform-origin: 213px 97px;
    animation: blink 4.2s ease-in-out infinite;
  }
  
  #body-group {
    transform-origin: 210px 230px;
    animation: breathe 4s ease-in-out infinite;
  }
  #smoke-path-1 {
    transform-origin: 22px 310px;
    animation: smoke1 2.4s ease-in-out infinite;
  }
  #smoke-path-2 {
    transform-origin: 30px 305px;
    animation: smoke2 2.4s ease-in-out 0.8s infinite;
  }
  #smoke-path-3 {
    transform-origin: 17px 320px;
    animation: smoke3 2.4s ease-in-out 1.6s infinite;
  }
  #smile-base { animation: expression 6s ease-in-out infinite; }
  #smile-happy { animation: expressionSmile 6s ease-in-out infinite; }
</style>
