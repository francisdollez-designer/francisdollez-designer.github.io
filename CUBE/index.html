<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover"/>
<title>Méthode Fridrich — CFOP</title>
<style>
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
:root{
  --ref:#FFCC41;--ref-text:#2a2a2a;--bg:#eff1f2;--page:#ffffff;
  --dark:#2a2a2a;--mid:#777;--r:12px;
  --safe:env(safe-area-inset-bottom,0px);
  --cL:#5da8ff;--cR:#58db74;--cU:#fab06b;
  --cD:#f0c040;--cF:#32C0CC;--cB:#B3B3B3;--cW:#F25D7B;
}
html,body{height:100%;background:var(--page);color:var(--dark);
  font-family:-apple-system,BlinkMacSystemFont,'Segoe UI',system-ui,sans-serif;
  overflow:hidden;-webkit-font-smoothing:antialiased}

/* ── APP SHELL ── */
.app{display:flex;flex-direction:column;height:100dvh}
header{display:flex;align-items:center;justify-content:space-between;
  padding:0 20px;height:72px;background:var(--page);
  flex-shrink:0;border-bottom:1px solid #e8e8e8;z-index:10;
  transition:background .15s ease}
.header-left{display:flex;align-items:center;gap:12px;min-width:0}
.header-logo{height:40px;flex-shrink:0;display:flex}
.header-logo svg{height:100%;width:auto;display:block}
.app-title{font-size:18px;font-weight:800;letter-spacing:-.03em;display:flex;align-items:center;gap:9px}
.header-icon{width:26px;height:26px}
.header-icon svg{width:15px;height:15px}
.burger{background:none;border:none;cursor:pointer;padding:8px;
  display:flex;flex-direction:column;gap:5px}
.burger span{display:block;width:22px;height:2px;background:var(--dark);border-radius:2px}

/* ── HEADER NAV (menu visible, version bureau) — mêmes pictos que le burger,
   état actif repris du fab-nav (barre sous le lien, largeur du picto+nom) ── */
.header-nav{display:none;align-items:center;gap:2px}
.header-nav-link{
  position:relative;display:flex;align-items:center;gap:9px;
  background:none;border:none;cursor:pointer;white-space:nowrap;
  padding:11px 14px;border-radius:12px;font-size:14px;font-weight:700;
  color:var(--mid);transition:color .12s ease,background .12s ease;
  -webkit-tap-highlight-color:transparent;
}
.header-nav-icon{
  width:26px;height:26px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.header-nav-icon svg{width:15px;height:15px}
.header-nav-link::after{
  content:'';position:absolute;left:14px;right:14px;bottom:-9px;
  height:3px;border-radius:3px;background:var(--ref);
  opacity:0;transform:translateY(-3px);
  transition:opacity .15s ease,transform .15s ease;
}
.header-nav-link:hover{background:var(--bg);color:var(--dark)}
.header-nav-link:hover::after{opacity:.55;transform:translateY(0)}
.header-nav-link.active{color:var(--dark)}
.header-nav-link.active::after{opacity:1;transform:translateY(0)}
/* Au-delà de la tablette : le menu devient visible dans le header,
   le burger (et le titre dynamique redondant avec le menu) disparaissent */
@media (min-width:860px){
  header{padding:0 28px}
  .header-nav{display:flex}
  .burger{display:none}
  .app-title{display:none}
}
main{flex:1;overflow-y:auto;overflow-x:hidden;-webkit-overflow-scrolling:touch}
.ncube{width:28px;height:28px}.ncube svg{width:100%;height:100%}

/* ── FAB NAV (Croix / F2L / OLL / PLL) — barre Material toujours ouverte ── */
.fab-nav{
  position:fixed;left:50%;transform:translateX(-50%);
  bottom:calc(16px + var(--safe));
  z-index:99;display:flex;align-items:center;gap:2px;
  background:#fff;border-radius:24px;padding:12px;
  box-shadow:0 4px 20px rgba(0,0,0,.18);
}
/* Web : ancrée en bas à droite au lieu de centrée */
@media (min-width:860px){
  .fab-nav{left:auto;right:24px;transform:none}
}
.fab-item{
  position:relative;
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;
  width:64px;padding:8px 4px;border-radius:18px;border:none;background:none;
  cursor:pointer;-webkit-tap-highlight-color:transparent;touch-action:manipulation;
}
.fab-item::after{
  content:'';position:absolute;left:50%;bottom:1px;
  width:26px;height:3px;border-radius:3px;background:var(--ref);
  opacity:0;transform:translateX(-50%) scaleX(0);
  transition:opacity .15s ease,transform .15s ease;
}
.fab-item:hover::after{opacity:1;transform:translateX(-50%) scaleX(.65)}
.fab-item.active::after{opacity:1;transform:translateX(-50%) scaleX(1)}
.fab-item .ncube{width:40px;height:40px;pointer-events:none}
.fab-label{
  font-size:12px;font-weight:700;color:var(--dark);
  white-space:nowrap;pointer-events:none;
}


/* ── FILTER BAR ── */
.filter-bar{
  display:flex;gap:8px;padding:10px 14px 0;
  flex-wrap:wrap;align-items:center;
}
.filter-label{
  font-size:13px;font-weight:800;color:var(--mid);
  letter-spacing:-.01em;white-space:nowrap;
}
.chips{display:flex;gap:7px;flex-wrap:wrap}
.chip{
  background:var(--bg);border:none;border-radius:20px;
  padding:8px 16px;font-size:14px;font-weight:700;
  color:var(--mid);cursor:pointer;white-space:nowrap;
  transition:background .12s,color .12s;
  -webkit-tap-highlight-color:transparent;
}
.chip:hover{background:#e4e8ed}
.chip.active{background:var(--ref);color:var(--ref-text)}

/* ── SECTION ── */
.section-wrap{padding:0 16px 100px}
.section-head{padding:16px 2px 8px}
.section-title{font-size:22px;font-weight:800;letter-spacing:-.02em}
.section-sub{font-size:12px;color:var(--mid);margin-top:3px;font-weight:500}

/* ── GRID ── */
.cards-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:500px){.cards-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:860px){.cards-grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:1100px){.cards-grid{grid-template-columns:repeat(4,1fr)}}
@media(min-width:1350px){.cards-grid{grid-template-columns:repeat(5,1fr)}}
@media(min-width:1600px){.cards-grid{grid-template-columns:repeat(6,1fr)}}

.group-label{
  grid-column:1/-1;font-size:10px;font-weight:700;
  text-transform:uppercase;letter-spacing:.1em;color:#c8c8c8;
  padding:14px 2px 4px;border-top:1px solid #ebebeb;margin-top:4px;
}
.group-label:first-of-type{border-top:none;margin-top:0;padding-top:0}

/* ── CARD ── */
.card{
  background:var(--bg);border-radius:var(--r);
  padding:10px 40px 8px;display:flex;flex-direction:column;
  align-items:center;gap:5px;cursor:pointer;
  border:2px solid transparent;text-align:center;
  transition:border-color .12s,box-shadow .12s,transform .1s;
  -webkit-tap-highlight-color:transparent;
}
.card svg{width:78px;height:78px;flex-shrink:0}
.card:active{transform:scale(.95)}
.card:hover{
  border-color:var(--ref);
  box-shadow:0 0 0 4px color-mix(in srgb,var(--ref) 14%,transparent);
}
.card-name{font-size:16px;color:var(--mid);min-height:20px;
  display:flex;align-items:center;justify-content:center;line-height:1.3}
.card-alg{
  font-size:16px;font-weight:700;
  letter-spacing:.02em;color:var(--dark);
  word-break:break-all;line-height:1.5;
}
.card-alg sup{font-size:6px;vertical-align:super}

/* ── POPUP ── */
.pop-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.52);z-index:100;
  display:flex;align-items:flex-end;
  opacity:0;pointer-events:none;transition:opacity .2s;
}
.pop-ov.open{opacity:1;pointer-events:all}
.pop-panel{
  background:var(--bg);border-radius:22px 22px 0 0;
  width:100%;max-height:94dvh;overflow-y:auto;
  padding:24px 20px calc(28px + var(--safe));
  transform:translateY(40px);
  transition:transform .26s cubic-bezier(.34,1.4,.64,1);
  display:flex;flex-direction:column;gap:16px;
}
.pop-panel::before{
  content:'';display:block;width:40px;height:4px;
  border-radius:2px;background:#d0d0d0;
  margin:-12px auto 4px;flex-shrink:0;
}
.pop-ov.open .pop-panel{transform:translateY(0)}

@media(min-width:700px){
  .pop-ov{align-items:center}
  .pop-panel{border-radius:20px;max-width:680px;margin:auto;max-height:88dvh}
  .pop-panel::before{display:none}
}

.pop-head{display:flex;align-items:flex-start;justify-content:space-between;gap:12px}
.pop-meta{display:flex;flex-direction:column;gap:5px}
.pop-name{font-size:17px;font-weight:800;line-height:1.2}
.pop-badges{display:flex;gap:6px;flex-wrap:wrap}
.pop-tag{
  font-size:14px;font-weight:700;display:inline-block;
  padding:2px 10px;border-radius:20px;
  background:color-mix(in srgb,var(--ref) 16%,transparent);
  color:color-mix(in srgb,var(--ref) 75%,#333);
}
.pop-shape{
  font-size:14px;font-weight:700;display:inline-block;
  padding:2px 10px;border-radius:20px;
  background:#eee;color:#666;
}
.pop-close{
  background:#e8e8e8;border:none;cursor:pointer;color:#666;
  width:30px;height:30px;border-radius:50%;font-size:15px;
  display:flex;align-items:center;justify-content:center;flex-shrink:0;
  transition:background .15s;
}
.pop-close:hover{background:#ddd}

.pop-cube{display:flex;justify-content:center}
.pop-cube svg{width:130px;height:130px}

.pop-alg{
  text-align:center;font-size:17px;font-weight:900;
  letter-spacing:.06em;color:var(--dark);
  line-height:1.7;word-break:break-all;
}
.pop-alg sup{font-size:11px;vertical-align:super}

.pop-alg-card{
  background:#fff;border-radius:10px;border:1px solid #eee;
  padding:12px 16px;display:flex;flex-direction:column;gap:10px;
}

.pop-tip{
  font-size:13px;color:#666;font-style:italic;
  background:#fff;border-radius:8px;padding:10px 14px;
  border-left:3px solid var(--ref);line-height:1.6;
}

.pop-moves-label{
  font-size:12px;font-weight:700;color:#bbb;
  text-transform:uppercase;letter-spacing:.1em;
}
.pop-moves{display:flex;flex-wrap:wrap;gap:6px 3px;justify-content:center}
.mv{display:flex;align-items:center;justify-content:center}
.mv svg{width:50px;height:auto;display:block}

/* ── MENU ── */
.menu-ov{
  position:fixed;inset:0;background:rgba(0,0,0,.42);
  z-index:200;opacity:0;pointer-events:none;transition:opacity .22s;
}
.menu-ov.open{opacity:1;pointer-events:all}
.menu-panel{
  position:absolute;top:0;right:0;width:min(300px,88vw);height:100%;
  background:#fff;padding:28px 20px;
  display:flex;flex-direction:column;gap:24px;overflow-y:auto;
  transform:translateX(100%);transition:transform .28s cubic-bezier(.4,0,.2,1);
}
.menu-ov.open .menu-panel{transform:translateX(0)}
.menu-top{display:flex;justify-content:space-between;align-items:center}
.menu-title-h{font-size:17px;font-weight:800}
.menu-logo{height:40px;display:flex;align-items:center}
.menu-logo svg{height:100%;width:auto;display:block}
.menu-x{
  background:#f0f0f0;border:none;cursor:pointer;color:#777;
  width:30px;height:30px;border-radius:50%;font-size:15px;
  display:flex;align-items:center;justify-content:center;
}
.menu-sec{display:flex;flex-direction:column;gap:12px}
.menu-sec-h{font-size:13px;font-weight:800;color:var(--dark);text-transform:uppercase;letter-spacing:.06em}
.menu-nav{display:flex;flex-direction:column;gap:4px}
.menu-link{
  display:flex;align-items:center;justify-content:space-between;
  background:none;border:none;text-align:left;cursor:pointer;
  padding:14px 12px;border-radius:10px;font-size:15px;font-weight:700;
  color:var(--dark);transition:background .12s;
  -webkit-tap-highlight-color:transparent;
}
.menu-label{display:flex;align-items:center;gap:11px}
.menu-icon{
  width:30px;height:30px;border-radius:50%;flex-shrink:0;
  display:flex;align-items:center;justify-content:center;
}
.menu-icon svg{width:17px;height:17px}
.title-dot{width:9px;height:9px;border-radius:50%;display:inline-block;margin-right:9px;vertical-align:middle;flex-shrink:0}
.menu-link:hover{background:#f5f5f5}
.menu-link.active{background:color-mix(in srgb,var(--ref) 16%,transparent)}
.menu-soon{
  font-size:9px;font-weight:700;color:#aaa;background:#f0f0f0;
  padding:3px 8px;border-radius:20px;text-transform:uppercase;letter-spacing:.05em;
}
.col-row{display:flex;flex-wrap:wrap;gap:10px}
.col-btn{
  display:flex;align-items:center;gap:8px;padding:10px 16px;
  border-radius:24px;border:2px solid #eee;cursor:pointer;
  font-size:14px;font-weight:700;color:var(--dark);background:var(--bg);
  transition:border-color .12s,background .12s;
}
.col-btn::before{
  content:'';width:16px;height:16px;border-radius:50%;
  background:var(--c);border:1.5px solid rgba(0,0,0,.1);flex-shrink:0;
}
.col-btn.active{border-color:var(--c);background:color-mix(in srgb,var(--c) 14%,#fff);font-weight:800}
.leg{display:flex;flex-direction:column;gap:9px}
.moves-cat-h{
  font-size:16px;font-weight:800;color:var(--mid);
  text-transform:uppercase;letter-spacing:.08em;margin:22px 2px 10px;
}
.moves-cat-h:first-child{margin-top:0}
.moves-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px}
.mv-item{
  display:flex;align-items:center;justify-content:center;
  background:var(--bg);border-radius:var(--r);padding:8px;
}
.mv-item svg{width:100%;height:auto;display:block}
.empty-block{
  display:flex;align-items:center;justify-content:center;text-align:center;
  min-height:200px;color:#bbb;font-size:14px;font-weight:600;
  background:var(--bg);border-radius:var(--r);padding:20px;
}
.leg-row{display:flex;align-items:center;gap:10px;font-size:12px;color:#444}
.leg-pill{
  border-radius:6px;padding:3px 8px;font-size:10px;font-weight:900;
  color:#1a1a1a;min-width:44px;text-align:center;display:inline-block;flex-shrink:0;
}

/* ══════════════════════════════════════════════════════
   CHRONO
   ══════════════════════════════════════════════════════ */
.chrono-wrap{
  display:flex;flex-direction:column;align-items:center;gap:20px;
  padding:16px 16px 110px;margin:0 auto;
  position:relative;
}
/* Web : largeur de lecture confortable, cohérente sur toutes les pages
   (Home, Chrono, Paramètres, OLL/PLL/Croix/F2L, Progression) plutôt que
   du contenu qui s'étire sur toute la largeur de l'écran. */
@media (min-width:860px){
  .section-wrap,.chrono-wrap{max-width:1100px;margin-left:auto;margin-right:auto}
}
/* Pages tableau de bord (Progression) : contenu pleine largeur et aligné
   à gauche, homogène avec Accueil/OLL/PLL plutôt que centré comme le chrono */
.chrono-wrap.dash-wrap{align-items:stretch;text-align:left}
@media {
  .chrono-wrap.dash-wrap{padding-left:16;padding-right:16}
}
.chrono-wrap.chrono-center{
  min-height:calc(100dvh - 54px);
  justify-content:center;
}
/* Écran 01 : mélange en bas, chrono géant au centre, Démarrer plaqué en bas */
.chrono-wrap.chrono-main-layout{
  min-height:calc(100dvh - 200px);
}
.chrono-time-zone{
  flex:1;width:100%;display:flex;align-items:center;justify-content:center;
  min-height: 45vh;
}
.chrono-time{
  font-size:clamp(200px,15vw,200px);font-weight:900;letter-spacing:-.02em;
  color:var(--dark);line-height:1;font-variant-numeric:tabular-nums;
  text-align:center;
}
.chrono-time.time-long{font-size:clamp(90px,12vw,110px)}
.chrono-time.chrono-time-hero{font-size:clamp(200px,26vw,200px)}
.chrono-time.chrono-time-hero.time-long{font-size:clamp(120px,17vw,150px)}
.chrono-time .t-sub{font-size:.42em;font-weight:800;opacity:.8;letter-spacing:0}
.chrono-btn-stack{display:flex;flex-direction:column;gap:12px;width: 100%;max-width: 500px;}
.chrono-btn-row{display:flex;gap:12px;width:100%}
.chrono-btn-row .chrono-btn{width:auto;flex:1}
.chrono-btn{
  width:100%;padding:19px;border-radius:50px;border:none;cursor:pointer;
  font-size:18px;font-weight:800;-webkit-tap-highlight-color:transparent;
  transition:transform .1s,opacity .15s;
}
.chrono-btn:active{transform:scale(.97)}
.chrono-btn-primary{background:var(--ref);color:var(--ref-text)}
.chrono-btn-secondary{background:var(--bg);color:var(--dark)}
.chrono-btn-danger{background:var(--bg);color:#c0392b}

.scramble-card{
  background:var(--bg);border-radius:var(--r);padding:18px 18px;
  display:flex;flex-direction:column;gap:10px;align-items:center;width: 100%;;max-width: 500px;flex-shrink:0;
}
.scramble-text{
  font-size:15px;font-weight:800;letter-spacing:.03em;text-align:center;
  line-height:1.7;color:var(--dark);word-break:break-all;
}
.scramble-text sup{font-size:10px;vertical-align:super}
.scramble-links{display:flex;align-items:center;justify-content:center;gap:4px;flex-wrap:wrap}
.scramble-link{
  display:flex;align-items:center;gap:6px;background:none;border:none;
  cursor:pointer;font-size:13px;font-weight:700;color:var(--mid);
  padding:8px 14px;border-radius:20px;transition:background .12s;
  -webkit-tap-highlight-color:transparent;
}
.scramble-link:hover{background:#e8e8e8}
.scramble-link svg{width:17px;height:17px;flex-shrink:0}

/* Écran chrono en cours — plein écran, fond coloré, tap-to-stop */
.chrono-run-ov{
  position:fixed;inset:0;z-index:150;background:var(--ref);
  display:none;flex-direction:column;align-items:center;justify-content:center;gap:20px;
  padding:24px;cursor:pointer;-webkit-tap-highlight-color:transparent;user-select:none;
  touch-action:manipulation;
}
.chrono-run-ov.open{display:flex}
.chrono-run-ov .chrono-time{font-size:clamp(200px,20vw,200px);margin-top:16px;color:var(--ref-text)}
.chrono-run-ov .chrono-time.time-long{font-size:clamp(110px,15vw,140px)}
.chrono-run-msg{
  border-radius: 200px;
  font-size:20px;font-weight:800;color:var(--ref-text);text-align:center;
  line-height:1.4;padding:8px 16px;min-height:24px;max-width:340px;
}
.chrono-run-hint{
  position:absolute;bottom:calc(28px + var(--safe));font-size:12px;font-weight:700;
  color:var(--ref-text);opacity:.55;text-transform:uppercase;letter-spacing:.06em;
}

.result-message{
  font-size:20px;font-weight:800;color:var(--dark);text-align:center;
  line-height:1.4;padding:0 10px;
}

/* ══════════════════════════════════════════════════════
   Écran 04 : résultat — overlay plein écran, fond dynamique
   ══════════════════════════════════════════════════════ */
.chrono-result-ov{
  position:fixed;inset:0;z-index:150;background:var(--page);
  display:none;align-items:center;justify-content:center;overflow:hidden;
  transition:background 1.4s ease;
}
.chrono-result-ov.open{display:flex}
.chrono-result-ov.celebrate{background:var(--ref)}
.chrono-result-ov.celebrate .chrono-time,
.chrono-result-ov.celebrate .result-message{color:var(--ref-text)}
.chrono-result-ov.sad{background:linear-gradient(180deg,#7c8a99,#57697b)}
.chrono-result-content{
  position:relative;z-index:3;width:100%;max-width:460px;padding:24px;
  display:flex;flex-direction:column;align-items:center;gap:20px;
}
.chrono-result-ov.sad .chrono-time,
.chrono-result-ov.sad .result-message{color:#e7ecf1}
.fx-layer{position:absolute;inset:0;overflow:hidden;pointer-events:none;z-index:1}

/* ── Célébration : rayons de soleil + pluie de confettis ── */
.sun-rays{
  position:absolute;top:50%;left:50%;width:220vmax;height:220vmax;
  transform:translate(-50%,-50%) rotate(0deg);
  background:repeating-conic-gradient(from 0deg,
    rgba(255,255,255,.65) 0deg 6deg, transparent 6deg 18deg);
  mix-blend-mode:overlay;
  animation:rotateRays 9s linear infinite, fadeRays 2.6s ease-out forwards;
}
@keyframes rotateRays{ to{ transform:translate(-50%,-50%) rotate(360deg); } }
@keyframes fadeRays{
  0%{opacity:0}
  15%{opacity:1}
  70%{opacity:.8}
  100%{opacity:0}
}
.confetti-piece{
  position:absolute;top:-16px;left:var(--left);width:9px;height:15px;
  background:var(--confetti-color);border-radius:2px;opacity:.95;
  transform:rotate(var(--rot));
  animation:confettiFall var(--dur) linear var(--delay) 2;
}
@keyframes confettiFall{
  0%{transform:translateY(0) rotate(var(--rot));opacity:1}
  100%{transform:translateY(115vh) rotate(calc(var(--rot) + 260deg));opacity:0}
}
.chrono-result-ov.celebrate .chrono-time{animation:recordPulse .7s ease-in-out 2}
.chrono-result-ov.celebrate .result-message{animation:popIn .5s ease both}
@keyframes recordPulse{
  0%,100%{transform:scale(1)}
  50%{transform:scale(1.12)}
}
@keyframes popIn{
  0%{opacity:0;transform:translateY(10px) scale(.9)}
  100%{opacity:1;transform:translateY(0) scale(1)}
}

/* ── Déception : pluie triste, fond gris-bleu ── */
.rain-drop{
  position:absolute;top:-60px;left:var(--left);width:2px;height:var(--len);
  background:linear-gradient(180deg,rgba(255,255,255,0),rgba(255,255,255,.55));
  animation:rainFall var(--dur) linear var(--delay) infinite;
}
@keyframes rainFall{
  0%{transform:translateY(0)}
  100%{transform:translateY(120vh)}
}
.chrono-result-ov.sad .chrono-time{animation:sadDroop 1.1s ease forwards}
.chrono-result-ov.sad .result-message{animation:fadeInSlow 1.2s ease both}
@keyframes sadDroop{
  0%{transform:translateY(0) rotate(0deg);opacity:1}
  60%{transform:translateY(8px) rotate(-3deg)}
  100%{transform:translateY(5px) rotate(-2deg);opacity:.9}
}
@keyframes fadeInSlow{
  0%{opacity:0;transform:translateY(6px)}
  100%{opacity:1;transform:translateY(0)}
}

/* ── Temps "normaux" : petite touche animée aléatoire, à chaque fois différente ── */
.chrono-pop{animation:softPopIn .45s ease both}
@keyframes softPopIn{
  0%{opacity:0;transform:scale(.85)}
  100%{opacity:1;transform:scale(1)}
}

/* variante 1 : étincelles */
.sparkle-piece{
  position:absolute;top:var(--top);left:var(--left);width:6px;height:6px;
  border-radius:50%;background:var(--spark-color);
  box-shadow:0 0 8px 2px var(--spark-color);opacity:0;
  animation:sparklePop var(--dur) ease var(--delay) 1;
}
@keyframes sparklePop{
  0%{opacity:0;transform:scale(.2)}
  40%{opacity:1;transform:scale(1.3)}
  100%{opacity:0;transform:scale(.6)}
}

/* variante 2 : vague de couleur */
.color-wave{
  position:absolute;top:-20%;left:-60%;width:60%;height:140%;
  background:linear-gradient(120deg,transparent,rgba(255,204,65,.35),transparent);
  transform:skewX(-15deg);
  animation:waveSweep 1.6s ease forwards;
}
@keyframes waveSweep{ 0%{left:-60%} 100%{left:120%} }

/* variante 3 : onde circulaire (ripple) */
.ripple-ring{
  position:absolute;top:50%;left:50%;width:40px;height:40px;margin:-20px 0 0 -20px;
  border:3px solid var(--ref);border-radius:50%;opacity:.8;
  animation:rippleOut 1.5s ease-out forwards;
}
@keyframes rippleOut{
  0%{transform:scale(.3);opacity:.8}
  100%{transform:scale(9);opacity:0}
}

/* variante 4 : bulles montantes, calmes */
.bubble-piece{
  position:absolute;bottom:-30px;left:var(--left);width:var(--size);height:var(--size);
  border-radius:50%;background:radial-gradient(circle at 30% 30%,rgba(255,255,255,.85),var(--bubble-color));
  opacity:0;animation:bubbleRise var(--dur) ease-in var(--delay) forwards;
}
@keyframes bubbleRise{
  0%{transform:translateY(0) translateX(0);opacity:0}
  15%{opacity:.75}
  100%{transform:translateY(-70vh) translateX(var(--drift));opacity:0}
}

/* ══════════════════════════════════════════════════════
   Cubes animés (Lottie) dans l'écran résultat
   Tailles doublées par rapport à la première version, plafonnées
   en vw/vh pour ne jamais déborder sur petit écran.
   ══════════════════════════════════════════════════════ */
.lottie-box{pointer-events:none}
.lottie-box-s{width:min(152px,42vw);height:min(152px,42vw);margin:0 auto}
.lottie-box-m{width:min(260px,72vw);height:min(260px,72vw);margin:0 auto}
.lottie-box-l{width:min(440px,88vw);height:min(440px,88vw);margin:0 auto}

/* Réussite — variante 2 : vagues de couleurs officielles en cascade, plus intenses */
.rainbow-wave{
  position:absolute;top:-20%;left:-60%;width:65%;height:140%;
  background:linear-gradient(120deg,transparent,var(--wave-color) 25%,var(--wave-color) 55%,transparent 85%);
  opacity:.9;transform:skewX(-15deg);mix-blend-mode:normal;
  animation:waveSweep 1.7s ease forwards;
}

/* Réussite — variante 3 : le cube part en fusée puis explose en feu d'artifice plein écran */
.lottie-box-rocket{
  position:absolute;bottom:6%;left:50%;width:min(160px,44vw);height:min(160px,44vw);
  transform:translateX(-50%);
  animation:rocketLaunch 1.15s cubic-bezier(.4,0,.2,1) forwards;
}
@keyframes rocketLaunch{
  0%{bottom:6%;opacity:1;transform:translateX(-50%) scale(.6) rotate(0deg)}
  65%{opacity:1}
  100%{bottom:80%;opacity:0;transform:translateX(-50%) scale(1.05) rotate(18deg)}
}
.firework-origin{position:absolute;width:0;height:0}
.firework-piece{
  position:absolute;top:0;left:0;width:7px;height:7px;border-radius:50%;
  background:var(--fw-color);box-shadow:0 0 9px 3px var(--fw-color);
  opacity:0;animation:fireworkBurst 1.1s ease-out forwards;
}
@keyframes fireworkBurst{
  0%{opacity:0;transform:translate(0,0) scale(.3)}
  15%{opacity:1}
  100%{opacity:0;transform:translate(var(--dx),var(--dy)) scale(1)}
}

/* Intermédiaire — variante 3 : pluie de cubes qui occupe tout l'écran */
.lottie-fall{
  position:absolute;top:-80px;left:var(--left);width:var(--size);height:var(--size);
  animation:lottieFallDrop var(--dur) linear var(--delay) infinite;
}
@keyframes lottieFallDrop{
  0%{transform:translateY(0) rotate(0deg)}
  100%{transform:translateY(120vh) rotate(180deg)}
}
/* Intermédiaire — variante 4 : un énorme cube qui tombe, occupe une grande partie de l'écran */
.lottie-fall-big{
  position:absolute;left:50%;top:-70vw;transform:translateX(-50%);
  animation:lottieBigDrop 1.7s cubic-bezier(.3,.6,.4,1) forwards;
}
@keyframes lottieBigDrop{
  0%{top:-70vw}
  78%{top:78vh}
  88%{top:70vh}
  100%{top:74vh}
}

/* Mosaïque de couleurs (tuiles), 2 usages : clignotement (intermédiaire)
   et passage au gris (mauvais temps) — jamais en opacité, toujours par
   échelle/filtre. Grille CARRÉE (5x5, bloc carré centré) pour que les
   tuiles restent des carrés parfaits même en écran large (web). */
/* Grille en pleine largeur : 10 colonnes, chaque tuile fait 1/10 de la
   largeur de l'écran (10vw) et la hauteur de chaque ligne est fixée à
   la même valeur (10vw) → carré parfait garanti quel que soit l'écran.
   On génère assez de lignes pour couvrir toute la hauteur (l'excédent,
   sur écran très large, est simplement masqué par overflow:hidden). */
.mosaic-grid{
  position:absolute;inset:0;overflow:hidden;
  display:grid;gap:10px;
  grid-template-columns:repeat(6,1fr);
  grid-auto-rows:calc((100vw - 50px) / 6);
}
.mosaic-tile{background:var(--tile-color);transform-origin:center}
.mosaic-tile-blink{animation:mosaicBlink 1.1s ease-in-out var(--t-delay) 3 forwards}
@keyframes mosaicBlink{
  0%,100%{transform:scale(1)}
  50%{transform:scale(0)}
}
.mosaic-tile-grey{animation:mosaicGreyOut 1.6s ease forwards var(--t-delay)}
@keyframes mosaicGreyOut{
  0%{filter:grayscale(0)}
  100%{filter:grayscale(1) brightness(.75)}
}
/* Le fond sombre reste (pas de retour au blanc) tant que cette variante est affichée */
.chrono-result-ov.mosaic-dark{background:#1c1c1c}

/* Mauvais temps — variante 2 : tout coule vers le bas, boutons penchés,
   fond assombri davantage que le dégradé "sad" par défaut */
.chrono-result-ov.sink{background:linear-gradient(180deg,#4b5866,#2c3742) !important}
.chrono-result-ov.sink .chrono-result-content{animation:sinkDown 1.3s ease forwards}
@keyframes sinkDown{ 0%{transform:translateY(0)} 100%{transform:translateY(16vh)} }
.chrono-result-ov.sink .chrono-btn-danger{animation:tiltLeft .8s ease forwards}
.chrono-result-ov.sink .chrono-btn-primary{animation:tiltRight .8s ease forwards}
@keyframes tiltLeft{ to{transform:rotate(-8deg) translateY(4px)} }
@keyframes tiltRight{ to{transform:rotate(7deg) translateY(4px)} }

/* Sous-nav chrono (Timer / Résultats) — même style que fab-nav */
.chrono-nav-icon{width:26px;height:26px;pointer-events:none}

/* Onglets historique (réutilise .chips / .chip) */
.history-list{display:flex;flex-direction:column;width:100%;gap:10px}
@media (min-width:860px){
  .history-list{
    display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));
    gap:14px;
  }
  .history-row,.history-row-compact{height:100%}
  .history-date-head{grid-column:1/-1}
}
.history-row{
  background:var(--bg);border-radius:var(--r);padding:16px;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.history-row-compact{
  background:var(--bg);border-radius:var(--r);padding:14px 16px;width:100%;position:relative;
  display:flex;flex-direction:column;align-items:center;gap:4px;cursor:pointer;
}
.period-filter{display:flex;gap:8px;width:100%;margin:2px 0 4px}
.period-select{
  flex:1;padding:10px 12px;border-radius:20px;border:1.5px solid #eee;
  background:#f7f7f7;font-size:13px;font-weight:700;color:var(--dark);
  -webkit-appearance:none;appearance:none;
}

/* ══════════════════════════════════════════════════════
   Écran Progression — stats, courbe, faits amusants
   ══════════════════════════════════════════════════════ */
.stat-grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;width:100%}
.stat-card{
  background:var(--bg);border-radius:var(--r);padding:16px;
  display:flex;flex-direction:column;align-items:center;gap:4px;text-align:center;
}
.stat-value{font-size:30px;font-weight:900;color:var(--dark);font-variant-numeric:tabular-nums}
.stat-label{font-size:16px;font-weight:700;color:var(--mid)}
.stat-note{font-size:16px;color:var(--mid);line-height:1.5;padding:2px 2px 0;text-align:left}

.tips-list{display:flex;flex-direction:column;gap:10px;width:100%}
.tips-item{
  display:flex;align-items:flex-start;gap:12px;background:var(--bg);
  border-radius:var(--r);padding:14px 16px;font-size:14px;color:var(--dark);line-height:1.5;
}
.tips-num{
  flex-shrink:0;width:24px;height:24px;border-radius:50%;background:var(--ref);color:var(--ref-text);
  display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:900;
}

/* ══════════════════════════════════════════════════════
   Écran Accueil
   ══════════════════════════════════════════════════════ */
.name-input{
  width:100%;padding:14px 16px;border-radius:var(--r);border:1.5px solid #eee;
  background:var(--bg);font-size:15px;font-weight:700;color:var(--dark);
}
.home-hero{padding:22px 4px 26px}
.home-hello{font-size:36px;font-weight:900;letter-spacing:-.02em;color:var(--dark);line-height:1.15}
.home-quote{font-size:19px;font-weight:600;color:var(--mid);margin-top:10px;line-height:1.4}

.home-cube-ill{width:76px;height:79px;flex-shrink:0}
.home-cube-ill svg{width:100%;height:100%;display:block}
.home-cube-ill-sm{width:56px;height:58px;margin-bottom:4px}

.home-last-card{
  width:100%;
  background:var(--bg);border:none;border-radius:16px;padding:20px;
  box-shadow:0 0 4px rgba(0,0,0,.1);cursor:pointer;text-align:center;margin-bottom:14px;
}
/* Ligne principale : cube + infos + CTA — empilés en mobile, alignés
   sur une même ligne à partir de la tablette large / desktop */
.home-last-main{display:flex;flex-direction:column;align-items:center;gap:16px;width:100%}
.home-last-top{display:inline-flex;align-items:center;gap:20px}
.home-last-info{flex:1;display:flex;flex-direction:column;align-items:flex-start;justify-content:center;text-align:left}
.home-last-label{font-size:18px;font-weight:700;color:var(--dark)}
.home-last-time{font-size:50px;font-weight:900;color:var(--dark);font-variant-numeric:tabular-nums;line-height:1.1;margin-top:2px}
.home-last-time .t-sub{font-size:.68em;font-weight:700;opacity:.75}

.home-last-tip{
  margin-top:14px;padding-top:14px;border-top:1px solid rgba(0,0,0,.07);
  font-size:13px;color:var(--mid);font-style:italic;line-height:1.5;
  text-align:left;width:100%;
}

.home-cta{
  display:inline-flex;align-items:center;justify-content:center;gap:10px;
  background:var(--ref);color:var(--ref-text);border-radius:70px;
  padding:13px 22px;font-size:16px;font-weight:700;width:fit-content;
  align-self:center;flex-shrink:0;
}
.home-cta svg{width:22px;height:22px}

.home-tiles-row{display:flex;gap:14px;width:100%;margin-bottom:14px}
.home-tile{
  flex:1;background:var(--bg);border:none;border-radius:16px;padding:20px 10px;
  box-shadow:0 0 4px rgba(0,0,0,.1);cursor:pointer;
  display:flex;flex-direction:wrap;align-items:center;text-align:left;
}
.home-tile-label{font-size:16px;font-weight:700;color:var(--dark)}

.home-progress-card{
  display:flex;flex-direction:column;gap:16px;width:100%;
  background:var(--bg);border:none;border-radius:16px;padding:20px;
  box-shadow:0 0 4px rgba(0,0,0,.1);cursor:pointer;text-align:left;margin-bottom:18px;
}
.home-progress-head{display:flex;align-items:center;gap:10px;font-size:20px;font-weight:800;color:var(--dark)}
.home-progress-picto{width:30px;height:28px;flex-shrink:0;display:flex}
.home-progress-picto svg{width:100%;height:100%;display:block}

@media (min-width:860px){
  .home-tiles-row{margin-left:auto;margin-right:auto}
  .home-last-card,.home-progress-card{margin-left:auto;margin-right:auto}
  /* Desktop : cube+infos à gauche, bouton "Lancer le chrono" aligné à
     droite sur la même ligne, plutôt qu'empilé sous le bloc infos */
  .home-last-main{flex-direction:row;align-items:center;justify-content:space-between;gap:24px}
  .home-last-card{text-align:left}
}

.lottie-box-xs{width:80px;height:80px}
.topflop-grid{display:grid;grid-template-columns:1fr 1fr;gap:12px;margin-bottom:18px}
.topflop-card{background:var(--bg);border-radius:var(--r);padding:14px}
.topflop-head{display:flex;align-items:center;gap:8px;font-size:24px;font-weight:800;color:var(--dark);margin-bottom:6px}
.topflop-row{
  display:wrap;align-items:center;gap:8px;padding:8px 2px;
  border-bottom:1px solid rgba(0,0,0,.06);cursor:pointer;
}
.topflop-row:last-child{border-bottom:none;padding-bottom:2px}
.topflop-rank{width:16px;font-size:18px;font-weight:800;color:var(--mid);flex-shrink:0;padding-right: 8px;}
.topflop-time{flex:1;font-size:20px;font-weight:800;color:var(--dark);font-variant-numeric:tabular-nums;padding-right: 8px;}
.topflop-date{font-size:16px;color:var(--mid);white-space:nowrap}
@media (min-width:860px){
  .home-grid{grid-template-columns:repeat(3,1fr)}
  .home-card-big{grid-column:auto;flex-direction:column;align-items:flex-start}
}

.progress-chart-card{background:var(--bg);border-radius:var(--r);padding:16px;width:100%}
.progress-chart-head{
  display:flex;align-items:center;justify-content:space-between;
  font-size:13px;font-weight:800;color:var(--dark);margin-bottom:10px;
}
.progress-chart-legend{display:flex;align-items:center;font-size:11px;font-weight:600;color:var(--mid)}
.progress-chart-legend .dot{width:8px;height:8px;border-radius:50%;display:inline-block;margin-right:5px;margin-left:10px}
.progress-chart-legend .dot:first-child{margin-left:0}
.progress-chart-svg{width:100%;height:130px;display:block}

.progress-banner{
  background:color-mix(in srgb,var(--ref) 20%,transparent);
  border-radius:var(--r);padding:14px 16px;font-size:14px;font-weight:700;
  color:var(--dark);text-align:center;width:100%;
}

.fact-card{background:var(--bg);border-radius:var(--r);padding:18px;width:100%;display:flex;flex-direction:column;gap:6px}
.fact-big{font-size:32px;font-weight:900;color:var(--dark)}
.fact-text{font-size:14px;color:var(--mid);line-height:1.5}
.fact-fun .fact-text{color:var(--dark)}
.phrase-item{font-size:14px;font-style:italic;color:var(--mid);padding:6px 0;border-bottom:1px solid rgba(0,0,0,.06)}
.phrase-item:last-child{border-bottom:none;padding-bottom:0}

@media (min-width:860px){
  .stat-grid{grid-template-columns:repeat(4,1fr)}
}
.history-time{font-size:45px;font-weight:900;color:var(--dark);font-variant-numeric:tabular-nums}
.history-date{font-size:22px;color:var(--dark);font-weight:500}
.history-badge{
  align-self:center;font-size:11px;font-weight:800;color:#fff;
  background:#08E326;
  padding:4px 12px;border-radius:20px;
}
.history-msg{
  font-size:16px;font-style:italic;color:var(--mid);text-align:center;
  margin-top:2px;max-width:90%;
}
.history-scramble{
  font-size:14px;color:var(--mid);text-align:center;line-height:1.6;
  margin-top:6px;padding-top:6px;border-top:1px solid rgba(0,0,0,.06);
  width:100%;word-break:break-word;
}
.history-scramble sup{font-size:10px}
.history-del{
  position:absolute;top:10px;right:10px;background:none;border:none;cursor:pointer;
  color:var(--mid);width:40px;height:40px;border-radius:50%;
  display:flex;align-items:center;justify-content:center;
  transition:background .12s,color .12s;-webkit-tap-highlight-color:transparent;
}
.history-del:hover{background:#e4e4e4;color:#c0392b}
.history-del svg{width:25px;height:25px}
.history-date-head{
  font-size:22px;font-weight:500;color:var(--dark);width:100%;
  text-transform:None;letter-spacing:.07em;margin:8px 2px 0;
}
.history-date-head:first-child{margin-top:0}
.history-row-compact .history-time{font-size:45px}
.history-row-compact .history-scramble{margin-top:8px}

/* ── LOADING ── */
.loading{
  display:flex;align-items:center;justify-content:center;
  height:200px;font-size:14px;color:#aaa;gap:10px;
}
.spinner{
  width:20px;height:20px;border:2px solid #eee;
  border-top-color:var(--ref);border-radius:50%;
  animation:spin .8s linear infinite;
}
@keyframes spin{to{transform:rotate(360deg)}}

/* Registre des instances Lottie actives dans l'écran résultat,
   pour pouvoir les détruire proprement (évite les fuites/doublons
   quand on relance un chrono). */
let ACTIVE_LOTTIES = [];
function destroyActiveLotties(){
  ACTIVE_LOTTIES.forEach(a => { try{ a.destroy(); }catch(e){} });
  ACTIVE_LOTTIES = [];
}
/**
 * Instancie une animation Lottie dans un conteneur DOM.
 * @param {string} containerId - id de l'élément vide qui accueille le SVG animé
 * @param {object} data - LOTTIE_SOLVE ou LOTTIE_MELT
 * @param {object} opts - {loop, autoplay, speed}
 */
function mountLottie(containerId, data, opts={}){
  const el = document.getElementById(containerId);
  if(!el || typeof lottie === 'undefined') return null;
  const anim = lottie.loadAnimation({
    container: el,
    renderer: 'svg',
    loop: opts.loop !== undefined ? opts.loop : false,
    autoplay: true,
    animationData: data,
  });
  if(opts.speed) anim.setSpeed(opts.speed);
  ACTIVE_LOTTIES.push(anim);
  return anim;
}

async function init(){
  try {
    const r = await fetch('data.json');
    if(!r.ok) throw new Error(r.status);
    DB = await r.json();
    renderNavCubes();
    loadRecords();
    goPage('home');
  } catch(e) {
    document.getElementById('main').innerHTML =
      `<div class="loading" style="flex-direction:column;gap:8px;color:#e55">
        <span>⚠ data.json introuvable</span>
        <span style="font-size:11px;color:#aaa">Placez data.json dans le même dossier que index.html</span>
      </div>`;
  }
}

function go(tab){
  curTab = tab;
  curFilter = 'all';
  curView = 'app';
  document.querySelectorAll('#fabNav .fab-item').forEach(b =>
    b.classList.toggle('active', b.dataset.tab === tab));
  updateHeader();
  updateMenuActive();
  showFab(true);
  render();
}

function selectTab(tab){
  go(tab);
}

function showFab(visible){
  document.getElementById('fabNav').style.display = visible ? '' : 'none';
}

// ── Fix tap mobile "raté" juste après un scroll ──
// Sur iOS/Android, un clic juste après un scroll inertiel peut être ignoré
// par l'event "click" (délai / suppression navigateur). On répond dès
// "touchend" pour un retour instantané, et on bloque le "click" fantôme
// qui suit pour éviter un double déclenchement.
function bindTap(el, fn){
  let handledByTouch = false;
  el.addEventListener('touchend', e => {
    e.preventDefault();
    handledByTouch = true;
    fn();
    setTimeout(() => { handledByTouch = false; }, 400);
  }, { passive:false });
  el.addEventListener('click', () => {
    if (handledByTouch) return;
    fn();
  });
}

const CHRONO_KEY = 'cfop_chrono_records';

function initChrono(){
  loadRecords();

function loadRecords(){
  try{ CHRONO_RECORDS = JSON.parse(localStorage.getItem(CHRONO_KEY) || '[]'); }
  catch(e){ CHRONO_RECORDS = []; }
  let needsSave = false;
  CHRONO_RECORDS.forEach(r => {
    if(!r.id){ r.id = r.date + '-' + Math.random().toString(36).slice(2,7); needsSave = true; }
  });
  if(needsSave) saveRecords();
}
function saveRecords(){
  localStorage.setItem(CHRONO_KEY, JSON.stringify(CHRONO_RECORDS));
}

function deleteRecord(id){
  if(!confirm('Supprimer ce temps ?')) return;
  CHRONO_RECORDS = CHRONO_RECORDS.filter(r => r.id !== id);
  saveRecords();
  renderChronoPage();
}

function genScramble(len = 18){
  const FACES = ['U','D','L','R','F','B'];
  const MODS  = ['', "'", '2'];
  const axisOf = f => ({U:'y',D:'y',L:'x',R:'x',F:'z',B:'z'}[f]);
  const seq = [];
  let lastFace = null, lastAxis = null;
  while(seq.length < len){
    const f = FACES[Math.floor(Math.random() * FACES.length)];
    if(f === lastFace) continue;
    if(axisOf(f) === lastAxis && Math.random() < 0.7) continue;
    const mod = MODS[Math.floor(Math.random() * MODS.length)];
    seq.push(f + mod);
    lastFace = f; lastAxis = axisOf(f);
  }
  return seq.join(' ');
}

function pad2(n){ return String(n).padStart(2,'0'); }

function formatTime(ms){
  const totalCs = Math.floor(ms / 10);
  const cs = totalCs % 100;
  const totalSec = Math.floor(totalCs / 100);
  const sec = totalSec % 60;
  const min = Math.floor(totalSec / 60);
  return min > 0
    ? `${min}.${pad2(sec)}.${pad2(cs)}`
    : `${sec}.${pad2(cs)}`;
}

// Découpe le temps en "grande" partie + centièmes plus petits (effet dynamique)
function formatTimeHTML(ms){
  const full = formatTime(ms);
  const lastDot = full.lastIndexOf('.');
  const main = full.slice(0, lastDot);
  const sub = full.slice(lastDot + 1);
  return `${main}<span class="t-sub">.${sub}</span>`;
}

function formatDateFR(iso){
  const d = new Date(iso);
  return d.toLocaleDateString('fr-FR', { day:'2-digit', month:'long', year:'numeric' });
}

// Décale aléatoirement (±2s) les seuils à chaque résolution, pour ne jamais
// avoir le même schéma "toujours à la même seconde"
function buildJitteredBuckets(){
  let prev = 0;
  return CHRONO_MESSAGES.map(b => {
    if(b.max === Infinity) return { max:Infinity, msgs:b.msgs };
    let jittered = b.max + (Math.random() * 4 - 2);
    if(jittered <= prev + 1) jittered = prev + 1;
    prev = jittered;
    return { max: jittered, msgs: b.msgs };
  });
}
function pickMessage(elapsedSec, buckets){
  const list = (buckets || CHRONO_MESSAGES).find(b => elapsedSec < b.max).msgs;
  return list[Math.floor(Math.random() * list.length)];
}

function pickConclusion(ms, isRecord, isWorst){
  const sec = ms / 1000;
  let bucket;
  if(isRecord) bucket = CHRONO_CONCLUDE.record;
  else if(isWorst) bucket = CHRONO_CONCLUDE.worst;
  else if(sec < 10) bucket = CHRONO_CONCLUDE.fast;
  else if(sec < 20) bucket = CHRONO_CONCLUDE.good;
  else if(sec < 40) bucket = CHRONO_CONCLUDE.average;
  else if(sec < 60) bucket = CHRONO_CONCLUDE.slow;
  else bucket = CHRONO_CONCLUDE.verySlow;
  return bucket[Math.floor(Math.random() * bucket.length)];
}

function rainbowWaveHTML(){
  const colors = ['#E92929','#FF9A1F','#FFCC41','#08E326','#0094FE'];
  return colors.map((c,i) =>
    `<div class="rainbow-wave" style="--wave-color:${c};animation-delay:${(i*0.12).toFixed(2)}s"></div>`
  ).join('');
}

function fireworkHTML(){
  const colors = ['#E92929','#0094FE','#08E326','#FFCC41','#FF9A1F','#ffffff'];
  // 20 foyers d'explosion répartis aléatoirement sur tout l'écran,
  // décalés dans le temps par vagues successives.
  const originCount = 20;
  const origins = [];
  for(let i = 0; i < originCount; i++){
    origins.push({
      top: (8 + Math.random() * 82).toFixed(1) + '%',
      left: (6 + Math.random() * 88).toFixed(1) + '%',
      delay: 1.05 + Math.random() * 0.9,
    });
  }
  return origins.map(o => {
    const n = 14;
    let pieces = '';
    for(let i = 0; i < n; i++){
      const angle = (360 / n * i) + (Math.random() * 10 - 5);
      const dist = 60 + Math.random() * 55;
      const dx = (Math.cos(angle * Math.PI / 180) * dist).toFixed(1);
      const dy = (Math.sin(angle * Math.PI / 180) * dist).toFixed(1);
      const c = colors[Math.floor(Math.random() * colors.length)];
      pieces += `<div class="firework-piece" style="--dx:${dx}px;--dy:${dy}px;--fw-color:${c};animation-delay:${o.delay.toFixed(2)}s"></div>`;
    }
    return `<div class="firework-origin" style="top:${o.top};left:${o.left}">${pieces}</div>`;
  }).join('');
}

      html += `<div class="${cls}" style="--tile-color:${color};--t-delay:${delay}s"></div>`;

// ── Écran 03 : chrono en cours (tap n'importe où pour arrêter) ──
let chronoBuckets = [];
function startChrono(){
  chronoRunning = true;
  chronoStartTs = performance.now();
  chronoMsgBucket = -1;
  chronoBuckets = buildJitteredBuckets();
  chronoCurMsg = pickMessage(0, chronoBuckets);
  document.getElementById('chronoRunMsg').textContent = chronoCurMsg;
  document.getElementById('chronoRunOv').classList.add('open');
  document.getElementById('chronoRunTime').innerHTML = '0<span class="t-sub">.00</span>';
  document.getElementById('chronoRunTime').classList.remove('time-long');
  const tick = () => {
    if(!chronoRunning) return;
    const elapsed = performance.now() - chronoStartTs;
    const timeEl = document.getElementById('chronoRunTime');
    timeEl.innerHTML = formatTimeHTML(elapsed);
    timeEl.classList.toggle('time-long', elapsed >= 60000);
    const bucketIdx = chronoBuckets.findIndex(b => elapsed / 1000 < b.max);
    if(bucketIdx !== chronoMsgBucket){
      chronoMsgBucket = bucketIdx;
      chronoCurMsg = pickMessage(elapsed / 1000, chronoBuckets);
      document.getElementById('chronoRunMsg').textContent = chronoCurMsg;
    }
    chronoRAF = requestAnimationFrame(tick);
  };
  chronoRAF = requestAnimationFrame(tick);
}

function stopChrono(){
  if(!chronoRunning) return;
  chronoRunning = false;
  if(chronoRAF) cancelAnimationFrame(chronoRAF);
  const elapsed = performance.now() - chronoStartTs;
  document.getElementById('chronoRunOv').classList.remove('open');

  const { topRank, flopRank } = getPerfRank(elapsed, CHRONO_RECORDS);
  const isRecord = topRank <= 3;
  const isWorst  = !isRecord && flopRank <= 3;

  // Rien n'est sauvegardé tant que l'utilisateur n'a pas choisi Garder / Supprimer
  pendingResult = { ms: elapsed, msg: pickConclusion(elapsed, isRecord, isWorst), isRecord, isWorst, topRank, flopRank };
  resultViewMode = false;
  chronoScreen = 'result';
  renderChronoPage();
}

// Classement top/flop d'un temps par rapport aux temps déjà enregistrés
// (sans compter le temps lui-même) : topRank=1 → le plus rapide, flopRank=1 → le plus lent.
function getPerfRank(ms, existingRecords){
  const faster = existingRecords.filter(r => r.ms < ms).length;
  const slower = existingRecords.filter(r => r.ms > ms).length;
  return { topRank: faster + 1, flopRank: slower + 1 };
}

// ── Écran 04 : résultat — overlay plein écran, fond dynamique, Garder / Supprimer ──
function renderChronoResult(){
  const isRecord = !!pendingResult?.isRecord;
  const isWorst  = !!pendingResult?.isWorst;
  const stateKey   = isRecord ? 'record' : (isWorst ? 'worst' : 'normal');
  const stateClass = isRecord ? 'celebrate' : (isWorst ? 'sad' : '');

  // Les top3 / flop3 ont chacun leur animation dédiée (par rang), pour
  // qu'on puisse vraiment en profiter à chaque fois plutôt qu'au hasard.
  let build;
  if(isRecord) build = RECORD_FX[Math.min(pendingResult.topRank, 3) - 1];
  else if(isWorst) build = WORST_FX[Math.min(pendingResult.flopRank, 3) - 1];
  else build = NORMAL_FX[Math.floor(Math.random() * NORMAL_FX.length)];
  const variant = build();

  destroyActiveLotties();

  const ov = document.getElementById('chronoResultOv');
  ov.className = 'chrono-result-ov open'
    + (stateClass ? ' ' + stateClass : '')
    + (variant.ovClass ? ' ' + variant.ovClass : '');

  document.getElementById('chronoResultFX').innerHTML = variant.fx || '';

  const ms = pendingResult?.ms || 0;
  const longCls = ms >= 60000 ? ' time-long' : '';
  const btnsHTML = resultViewMode
    ? `<div class="chrono-btn-row">
        <button class="chrono-btn chrono-btn-danger" onclick="closeReplay()">Fermer</button>
        <button class="chrono-btn chrono-btn-primary" onclick="shareResult()">Partager</button>
      </div>`
    : `<div class="chrono-btn-row">
        <button class="chrono-btn chrono-btn-danger" onclick="discardResult()">Supprimer</button>
        <button class="chrono-btn chrono-btn-primary" onclick="keepResult()">Sauvegarder</button>
      </div>`;

  document.getElementById('chronoResultContent').innerHTML = `
    ${variant.extra || ''}
    <div class="chrono-time chrono-pop${longCls}">${formatTimeHTML(ms)}</div>
    <div class="result-message">${pendingResult?.msg || ''}</div>
    ${btnsHTML}
  `;

  (variant.mounts || []).forEach(m => mountLottie(m.id, m.data, m.opts));

  if(chronoResultBgTimer){ clearTimeout(chronoResultBgTimer); chronoResultBgTimer = null; }
  if(isRecord){
    // Le fond jaune + rayons ne durent que le temps de la célébration,
    // puis on repasse au blanc pour que "Sauvegarder" reste bien lisible.
    chronoResultBgTimer = setTimeout(() => {
      ov.classList.remove('celebrate');
      chronoResultBgTimer = null;
    }, 2600);
  }
  // Le fond sombre de la mosaïque clignotante (variante intermédiaire) reste
  // affiché tant que cet écran résultat est visible (pas de retour au blanc).
}

function keepResult(){
  if(pendingResult){
    const id = Date.now() + '-' + Math.random().toString(36).slice(2,7);
    CHRONO_RECORDS.push({
      id, ms: pendingResult.ms, date: new Date().toISOString(),
      scramble: curScramble, msg: pendingResult.msg
    });
    saveRecords();
  }
  pendingResult = null;
  curScramble = genScramble();
  chronoScreen = 'main';
  renderChronoPage();
}

function discardResult(){
  pendingResult = null;
  curScramble = genScramble();
  chronoScreen = 'main';
  renderChronoPage();
}

// ── Rejeu d'un temps déjà sauvegardé, depuis l'historique ──
// On recalcule record/pire-temps par rapport à l'historique actuel (et non
// figé au moment de la résolution), pour rester cohérent si d'autres temps
// ont été ajoutés ou supprimés depuis.
function replayResult(id){
  const r = CHRONO_RECORDS.find(x => x.id === id);
  if(!r) return;
  const sorted = [...CHRONO_RECORDS].sort((a,b) => a.ms - b.ms);
  const topRank = sorted.findIndex(x => x.id === r.id) + 1;
  const flopRank = sorted.length - topRank + 1;
  const isRecord = topRank <= 3;
  const isWorst  = !isRecord && flopRank <= 3;
  pendingResult = { ms:r.ms, msg:r.msg, isRecord, isWorst, topRank, flopRank };
  resultViewMode = true;
  chronoScreen = 'result';
  renderChronoPage();
}

function closeReplay(){
  resultViewMode = false;
  pendingResult = null;
  chronoScreen = 'main';
  renderChronoPage();
}

function shareResult(){
  if(!pendingResult) return;
  const text = `Mon temps sur le Rubik's Cube : ${formatTime(pendingResult.ms)}${pendingResult.msg ? ' — ' + pendingResult.msg : ''}`;
  if(navigator.share){
    navigator.share({ title: 'Méthode Fridrich', text }).catch(() => {});
  } else if(navigator.clipboard){
    navigator.clipboard.writeText(text).then(() => alert('Résultat copié dans le presse-papiers !'));
  } else {
    alert(text);
  }
}

// Regroupe intelligemment : Aujourd'hui / Hier / nom du jour (< 7j) / date complète
function groupLabelFor(iso){
  const d = new Date(iso);
  const now = new Date();
  const dOnly = new Date(d.getFullYear(), d.getMonth(), d.getDate());
  const nOnly = new Date(now.getFullYear(), now.getMonth(), now.getDate());
  const diffDays = Math.round((nOnly - dOnly) / 86400000);
  if(diffDays === 0) return "Aujourd'hui";
  if(diffDays === 1) return "Hier";
  if(diffDays > 1 && diffDays < 7){
    const wd = d.toLocaleDateString('fr-FR', { weekday:'long' });
    return wd.charAt(0).toUpperCase() + wd.slice(1);
  }
  return formatDateFR(iso);
}

// Notation scientifique lisible : 4.3 × 10¹⁹
function toSuperscript(num){
  const map = {'0':'⁰','1':'¹','2':'²','3':'³','4':'⁴','5':'⁵','6':'⁶','7':'⁷','8':'⁸','9':'⁹','-':'⁻'};
  return String(num).split('').map(c => map[c] || c).join('');
}
function formatSci(n){
  if(n < 1000) return Math.round(n).toString();
  const exp = Math.floor(Math.log10(n));
  const mantissa = n / Math.pow(10, exp);
  return `${mantissa.toFixed(1)} × 10${toSuperscript(exp)}`;
}

function computeChronoStats(){
  const all = [...CHRONO_RECORDS].sort((a,b) => new Date(a.date) - new Date(b.date));
  const n = all.length;
  if(!n) return null;

  const times = all.map(r => r.ms);
  const sum = times.reduce((a,b) => a + b, 0);
  const avg = sum / n;
  const best = Math.min(...times);
  const worst = Math.max(...times);

  const last5 = times.slice(-5);
  const last12 = times.slice(-12);
  const ao5 = last5.length === 5 ? last5.reduce((a,b)=>a+b,0) / 5 : null;
  const ao12 = last12.length === 12 ? last12.reduce((a,b)=>a+b,0) / 12 : null;

  // Série de jours consécutifs avec au moins une résolution, jusqu'à aujourd'hui
  const daySet = new Set(all.map(r => new Date(r.date).toDateString()));
  let streak = 0;
  let cursor = new Date();
  while(daySet.has(cursor.toDateString())){
    streak++;
    cursor.setDate(cursor.getDate() - 1);
  }

  const todayStr = new Date().toDateString();
  const todayCount = all.filter(r => new Date(r.date).toDateString() === todayStr).length;
  const weekAgo = Date.now() - 7 * 86400000;
  const weekCount = all.filter(r => new Date(r.date).getTime() >= weekAgo).length;

  const byDay = {};
  all.forEach(r => {
    const k = new Date(r.date).toDateString();
    byDay[k] = (byDay[k] || 0) + 1;
  });
  let bestDayCount = 0;
  Object.values(byDay).forEach(c => { if(c > bestDayCount) bestDayCount = c; });

  const first10 = times.slice(0, Math.min(10, n));
  const last10 = times.slice(-Math.min(10, n));
  const firstAvg = first10.reduce((a,b)=>a+b,0) / first10.length;
  const lastAvg = last10.reduce((a,b)=>a+b,0) / last10.length;
  const improvementPct = n >= 4 ? Math.round((1 - lastAvg / firstAvg) * 100) : null;

  const lastMessages = all.slice(-5).reverse().map(r => r.msg).filter(Boolean);

  return { n, avg, best, worst, ao5, ao12, streak, todayCount, weekCount, bestDayCount, improvementPct, totalMs: sum, lastMessages };
}

// Petite courbe SVG (sparkline) des derniers temps — plus haut = plus rapide
function progressChartSVG(times){
  const w = 600, h = 150, pad = 10;
  const n = times.length;
  const min = Math.min(...times), max = Math.max(...times);
  const range = Math.max(1, max - min);
  const stepX = (w - pad * 2) / (n - 1);
  const pts = times.map((t,i) => [
    pad + i * stepX,
    pad + ((t - min) / range) * (h - pad * 2),
  ]);
  const path = pts.map((p,i) => (i === 0 ? 'M' : 'L') + p[0].toFixed(1) + ',' + p[1].toFixed(1)).join(' ');
  const areaPath = `${path} L${pts[pts.length-1][0].toFixed(1)},${h-pad} L${pts[0][0].toFixed(1)},${h-pad} Z`;
  const bestIdx = times.indexOf(min), worstIdx = times.lastIndexOf(max);
  const dots = pts.map((p,i) => {
    const isBest = i === bestIdx, isWorst = i === worstIdx;
    const c = isBest ? '#08E326' : isWorst ? '#B71234' : '#5DA8FF';
    const r = (isBest || isWorst) ? 4.5 : 2.5;
    return `<circle cx="${p[0].toFixed(1)}" cy="${p[1].toFixed(1)}" r="${r}" fill="${c}"/>`;
  }).join('');
  return `<svg viewBox="0 0 ${w} ${h}" class="progress-chart-svg" preserveAspectRatio="none">
    <defs><linearGradient id="progGrad" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#5DA8FF" stop-opacity=".35"/>
      <stop offset="100%" stop-color="#5DA8FF" stop-opacity="0"/>
    </linearGradient></defs>
    <path d="${areaPath}" fill="url(#progGrad)"/>
    <path d="${path}" fill="none" stroke="#5DA8FF" stroke-width="2.5" stroke-linejoin="round" stroke-linecap="round"/>
    ${dots}
  </svg>`;
}

function funFactHTML(s, TOTAL_PERMS, yearsToExhaust, universeRatio, totalMin){
  const facts = [
    () => `Le Rubik's Cube possède <strong>${formatSci(TOTAL_PERMS)}</strong> combinaisons possibles.

    () => {

      return `À ton temps moyen actuel (${formatTime(Math.round(s.avg))}), tu pourrais enchaîner environ

  ];
  return facts[Math.floor(Math.random() * facts.length)]();
}

// Choisit un texte blanc ou sombre selon la luminosité de la couleur de fond,
// pour rester lisible même quand --ref est une couleur foncée (rouge, bleu, vert).
function textColorFor(hex){
  hex = hex.replace('#', '');
  const r = parseInt(hex.substr(0,2), 16) / 255;
  const g = parseInt(hex.substr(2,2), 16) / 255;
  const b = parseInt(hex.substr(4,2), 16) / 255;
  const lin = c => c <= 0.03928 ? c / 12.92 : Math.pow((c + 0.055) / 1.055, 2.4);
  const L = 0.2126 * lin(r) + 0.7152 * lin(g) + 0.0722 * lin(b);
  return L > 0.42 ? '#2a2a2a' : '#ffffff';
}

// ══════════════════════════════════════════════════════
//  CUBE SVG
// ══════════════════════════════════════════════════════
function cc(c){ return c==='Y' ? REF : c==='G' ? '#a2acae' : c; }

// Couleurs par défaut codées en dur dans les illustrations PLL (Figma),
// avec Jaune au-dessus : Devant=Rouge, Derrière=Orange, Gauche=Bleu, Droite=Vert.
const DEFAULT_SIDES = { front:'#E92929', back:'#FF9A1F', left:'#0094FE', right:'#08E326' };

// Pour chaque couleur de référence possible, l'arrangement résultant d'une VRAIE
// rotation physique du cube (pas un simple échange arbitraire) — voir explication.
const COLOR_SCHEMES = {
  '#FFCC41': { front:'#E92929', back:'#FF9A1F', left:'#0094FE', right:'#08E326' }, // Jaune (défaut)
  '#ffffff': { front:'#FF9A1F', back:'#E92929', left:'#0094FE', right:'#08E326' }, // Blanc
  '#E92929': { front:'#ffffff', back:'#FFCC41', left:'#0094FE', right:'#08E326' }, // Rouge
  '#FF9A1F': { front:'#FFCC41', back:'#ffffff', left:'#0094FE', right:'#08E326' }, // Orange
  '#08E326': { front:'#E92929', back:'#FF9A1F', left:'#FFCC41', right:'#ffffff' }, // Vert
  '#0094FE': { front:'#E92929', back:'#FF9A1F', left:'#ffffff', right:'#FFCC41' }, // Bleu
};

// Retourne l'illustration Figma réelle si disponible pour ce cas (actuellement PLL),
// sinon le rendu généré à partir de state (fallback).
function pieceSVG(c, sz){
  if (PLLSVG[c.id]) return recolorPLL(PLLSVG[c.id]);
  return cubesvg(c.state, sz);
}

// Remplace le jaune du dessus ET les 4 couleurs de côté selon le schéma correspondant
// à la couleur de référence choisie (REF). Passage par des marqueurs temporaires
// pour éviter qu'un remplacement n'en écrase un autre en cours de route.
function recolorPLL(svg){
  const scheme = COLOR_SCHEMES[REF] || COLOR_SCHEMES['#FFCC41'];
  let out = svg
    .replaceAll(DEFAULT_SIDES.front, '§F§')
    .replaceAll(DEFAULT_SIDES.back,  '§B§')
    .replaceAll(DEFAULT_SIDES.left,  '§L§')
    .replaceAll(DEFAULT_SIDES.right, '§R§')
    .replaceAll('#FFCC41', REF)
    .replaceAll('§F§', scheme.front)
    .replaceAll('§B§', scheme.back)
    .replaceAll('§L§', scheme.left)
    .replaceAll('§R§', scheme.right);

  // Sur fond Rouge ou Bleu, les flèches noires/brunes se lisent mal :
  // on les repasse en blanc pour garder un bon contraste.
  if (REF === '#E92929' || REF === '#0094FE') {
    out = out
      .replaceAll('fill="black"', 'fill="#ffffff"')
      .replaceAll('fill="#912F2F"', 'fill="#ffffff"');
  }
  return out;
}

function cubesvg(s, sz){
  sz = sz || 80;
  const M=sz*.10, g=sz*.025;
  const cell=(sz-M*2-g*2-g*2)/3;
  const x0=M+g, y0=M+g;
  const top=s.top||Array(9).fill('G');
  const tN=s.tN||['G','G','G'], tS=s.tS||['G','G','G'];
  const tW=s.tW||['G','G','G'], tE=s.tE||['G','G','G'];
  let r='';
  for(let row=0;row<3;row++) for(let col=0;col<3;col++){
    const x=(x0+col*(cell+g)).toFixed(1), y=(y0+row*(cell+g)).toFixed(1);
    r+=`<rect x="${x}" y="${y}" width="${cell.toFixed(1)}" height="${cell.toFixed(1)}" rx="2" fill="${cc(top[row*3+col])}"/>`;
  }
  for(let c=0;c<3;c++){
    const x=(x0+c*(cell+g)).toFixed(1), h=(M-g).toFixed(1), w=cell.toFixed(1);
    r+=`<rect x="${x}" y="${g.toFixed(1)}" width="${w}" height="${h}" rx="1" fill="${cc(tN[c])}"/>`;
    r+=`<rect x="${x}" y="${(y0+3*cell+2*g+g).toFixed(1)}" width="${w}" height="${h}" rx="1" fill="${cc(tS[c])}"/>`;
  }
  for(let row=0;row<3;row++){
    const y=(y0+row*(cell+g)).toFixed(1), w=(M-g).toFixed(1), h=cell.toFixed(1);
    r+=`<rect x="${g.toFixed(1)}" y="${y}" width="${w}" height="${h}" rx="1" fill="${cc(tW[row])}"/>`;
    r+=`<rect x="${(x0+3*cell+2*g+g).toFixed(1)}" y="${y}" width="${w}" height="${h}" rx="1" fill="${cc(tE[row])}"/>`;
  }
  return `<svg viewBox="0 0 ${sz} ${sz}" xmlns="http://www.w3.org/2000/svg">${r}</svg>`;
}

// ══════════════════════════════════════════════════════
//  FORMAT ALGORITHME (exposants ² et ′)
// ══════════════════════════════════════════════════════
function fmt(alg){
  return alg
    .replace(/([A-Za-z][w]?)2/g, '$1<sup>2</sup>')
    .replace(/([A-Za-z][w]?)'/g,  "$1<sup>′</sup>");
}

// Fallback générique pour les mouvements sans SVG dédié (r, l, u, d, f, y, z, etc.)
function msvgGeneric(tok){
  const b=tok[0], B=b.toUpperCase();
  const colors={L:'#5DA8FF',R:'#58DB74',U:'#FAB06B',D:'#F2D35D',F:'#32C0CC',B:'#B3B3B3',M:'#F25D7B',S:'#32C0CC',E:'#F2D35D',X:'#9747FF',Y:'#FAB06B',Z:'#32C0CC'};
  const col = /[rludfbs]/.test(b) ? '#F25D7B' : /[xyz]/.test(b) ? '#9747FF' : (colors[B]||'#ccc');
  const fg  = (col==='#9747FF'||col==='#F25D7B') ? 'white' : '#2D2D2D';
  const N='#C6C6C6';
  const cells=Array(9).fill(N);
  if(B==='L'||b==='l'||B==='M'){cells[0]=cells[3]=cells[6]=col}
  else if(B==='R'||b==='r'){cells[1]=cells[2]=cells[4]=cells[5]=cells[7]=cells[8]=col}
  else if(B==='U'||b==='u'){cells[0]=cells[1]=cells[2]=cells[3]=cells[4]=cells[5]=col}
  else if(B==='D'||b==='d'){cells[3]=cells[4]=cells[5]=cells[6]=cells[7]=cells[8]=col}
  else{for(let i=0;i<9;i++)cells[i]=col}
  const CG=1.4, cw=20.46, ch=20.46, gx=2.87, gy=39;
  let grid='';
  for(let row=0;row<3;row++) for(let c=0;c<3;c++)
    grid+=`<rect x="${(gx+c*(cw+CG)).toFixed(1)}" y="${(gy+row*(ch+CG)).toFixed(1)}" width="${cw}" height="${ch}" fill="${cells[row*3+c]}"/>`;
  // Flèche directionnelle
  const red='#EC3C3C', prime=tok.includes("'");
  let arrow='';
  if(/[LlMRr]/.test(b)||/[LMR]/.test(B)){
    const ax=(/[Rr]/.test(b)||B==='R')?64:6;
    const [y1,y2]=prime?[96,50]:[50,96];
    const tip=prime?42:103;
    arrow=`<line x1="${ax}" y1="${y1}" x2="${ax}" y2="${y2}" stroke="${red}" stroke-width="3" stroke-linecap="round"/>
    <polygon points="${ax-5},${y2} ${ax+5},${y2} ${ax},${tip}" fill="${red}"/>`;
  } else if(/[UuDd]/.test(b)||/[UDE]/.test(B)){
    const ay=(/[Dd]/.test(b)||B==='D'||B==='E')?93:51;
    const [x1,x2]=prime?[57,13]:[13,57]; const tip=prime?6:64;
    arrow=`<line x1="${x1}" y1="${ay}" x2="${x2}" y2="${ay}" stroke="${red}" stroke-width="3" stroke-linecap="round"/>
    <polygon points="${x2},${ay-5} ${x2},${ay+5} ${tip},${ay}" fill="${red}"/>`;
  } else {
    const r=16, cx=35, cy=73;
    arrow=prime
      ?`<path d="M${cx-r},${cy} A${r},${r} 0 1 0 ${cx},${cy+r}" fill="none" stroke="${red}" stroke-width="3" stroke-linecap="round"/><polygon points="${cx-5},${cy+r} ${cx+5},${cy+r} ${cx},${cy+r+8}" fill="${red}"/>`
      :`<path d="M${cx+r},${cy} A${r},${r} 0 1 1 ${cx},${cy+r}" fill="none" stroke="${red}" stroke-width="3" stroke-linecap="round"/><polygon points="${cx-5},${cy+r} ${cx+5},${cy+r} ${cx},${cy+r+8}" fill="${red}"/>`;
  }
  return `<svg viewBox="0 0 70 108" fill="none" xmlns="http://www.w3.org/2000/svg">
    <rect x="20" width="30" height="30" rx="15" fill="${col}"/>
    <text x="35" y="21" text-anchor="middle" font-family="system-ui,sans-serif" font-size="12" font-weight="900" fill="${fg}">${tok}</text>
    ${grid}${arrow}</svg>`;
}

function moveSVG(tok){
  return MSVG[tok] || msvgGeneric(tok);
}

function parseMoves(f){
  const t=[], re=/[rludfbmsexyzRLUDFBMSEXYZ][w]?['2]?/g; let m;
  while((m=re.exec(f))!==null) t.push(m[0]); return t;
}

function buildMovesHTML(formula){
  return parseMoves(formula)
    .map(tok=>`<div class="mv">${moveSVG(tok)}</div>`)
    .join('');
}

    'nc-pll':  {top:Array(9).fill('Y'),tN:['G','G','G'],tS:['G','G','G'],tW:['G','G','G'],tE:['G','G','G']},
