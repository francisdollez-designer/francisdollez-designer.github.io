<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Méthode Fridrich</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- BURGER MENU OVERLAY -->
  <div class="menu-overlay" id="menuOverlay">
    <div class="menu-panel" id="menuPanel">
      <div class="menu-header">
        <span class="menu-title">Options</span>
        <button class="menu-close" id="menuClose" aria-label="Fermer le menu">✕</button>
      </div>
      <div class="menu-section">
        <p class="menu-label">Couleur de référence (face du dessus)</p>
        <div class="color-picker-row">
          <button class="color-btn active" data-color="#ffbb27" data-name="Jaune" style="--c:#ffbb27" onclick="setRefColor(this)">Jaune</button>
          <button class="color-btn" data-color="#ffffff" data-name="Blanc" style="--c:#ffffff" onclick="setRefColor(this)">Blanc</button>
          <button class="color-btn" data-color="#e84646" data-name="Rouge" style="--c:#e84646" onclick="setRefColor(this)">Rouge</button>
          <button class="color-btn" data-color="#ff6000" data-name="Orange" style="--c:#ff6000" onclick="setRefColor(this)">Orange</button>
          <button class="color-btn" data-color="#3aaa5c" data-name="Vert" style="--c:#3aaa5c" onclick="setRefColor(this)">Vert</button>
          <button class="color-btn" data-color="#3a6be8" data-name="Bleu" style="--c:#3a6be8" onclick="setRefColor(this)">Bleu</button>
        </div>
      </div>
      <div class="menu-section">
        <p class="menu-label">Légende des mouvements</p>
        <div class="legend-row"><span class="move-pill" style="background:#5da8ff">L / L'</span> Face gauche</div>
        <div class="legend-row"><span class="move-pill" style="background:#58db74">R / R'</span> Face droite</div>
        <div class="legend-row"><span class="move-pill" style="background:#fab06b">U / U'</span> Face supérieure</div>
        <div class="legend-row"><span class="move-pill" style="background:#e85252">F / F'</span> Face frontale</div>
        <div class="legend-row"><span class="move-pill" style="background:#c678e8">B / B'</span> Face arrière</div>
        <div class="legend-row"><span class="move-pill" style="background:#9e9e9e">D / D'</span> Face inférieure</div>
        <div class="legend-row"><span class="move-pill" style="background:#78c8f8">r / l</span> Tranche large (wide)</div>
      </div>
    </div>
  </div>

  <!-- POPUP FORMULE -->
  <div class="popup-overlay" id="popupOverlay">
    <div class="popup-panel" id="popupPanel">
      <div class="popup-header">
        <div>
          <span class="popup-fig-name" id="popupFigName">Nom de la figure</span>
          <span class="popup-fig-tag" id="popupFigTag">OLL</span>
        </div>
        <button class="popup-close" id="popupClose" aria-label="Fermer">✕</button>
      </div>
      <div class="popup-cube-area" id="popupCubeArea">
        <!-- cube SVG généré dynamiquement -->
      </div>
      <div class="popup-formula-text" id="popupFormulaText"></div>
      <div class="popup-moves" id="popupMoves">
        <!-- moves générés dynamiquement -->
      </div>
    </div>
  </div>

  <!-- APP SHELL -->
  <div class="app">
    <header class="app-header">
      <h1 class="app-title">Méthode Fridrich</h1>
      <button class="burger-btn" id="burgerBtn" aria-label="Ouvrir le menu">
        <span></span><span></span><span></span>
      </button>
    </header>

    <main class="app-main" id="appMain">
      <!-- Contenu injecté par JS -->
    </main>

    <nav class="bottom-nav" role="navigation" aria-label="Navigation principale">
      <button class="nav-item" data-tab="croix" onclick="switchTab('croix')">
        <div class="nav-cube" id="navCubeCroix"></div>
        <span>Croix</span>
      </button>
      <button class="nav-item" data-tab="f2l" onclick="switchTab('f2l')">
        <div class="nav-cube" id="navCubeF2L"></div>
        <span>F2L</span>
      </button>
      <button class="nav-item active" data-tab="oll" onclick="switchTab('oll')">
        <div class="nav-cube" id="navCubeOLL"></div>
        <span>OLL</span>
      </button>
      <button class="nav-item" data-tab="ollplus" onclick="switchTab('ollplus')">
        <div class="nav-cube" id="navCubeOLLPlus"></div>
        <span>OLL+</span>
      </button>
      <button class="nav-item" data-tab="pll" onclick="switchTab('pll')">
        <div class="nav-cube" id="navCubePLL"></div>
        <span>PLL</span>
      </button>
    </nav>
  </div>

  <script src="data.js"></script>
  <script src="cube.js"></script>
  <script src="app.js"></script>
</body>
</html>
