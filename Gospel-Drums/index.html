<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Set Gospel de Noël — Répétition batterie</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,400;9..144,500;9..144,600&family=Work+Sans:wght@400;500;600&display=swap" rel="stylesheet">
<style>
  :root{
    --bg: #10142A;
    --panel: #1A2047;
    --panel-hi: #232B5C;
    --gold: #D4A657;
    --gold-dim: #8C7239;
    --text: #F1EEE6;
    --muted: #8B90B5;
    --line: #2A3166;
    --done: #86A583;
    --radius: 10px;
  }

  *{ box-sizing: border-box; }

  html{ scroll-behavior: smooth; }

  body{
    margin:0;
    background: var(--bg);
    background-image:
      radial-gradient(1px 1px at 20% 15%, rgba(212,166,87,0.35) 0, transparent 50%),
      radial-gradient(1px 1px at 70% 8%, rgba(241,238,230,0.25) 0, transparent 50%),
      radial-gradient(1.5px 1.5px at 85% 30%, rgba(212,166,87,0.25) 0, transparent 50%),
      radial-gradient(1px 1px at 40% 40%, rgba(241,238,230,0.2) 0, transparent 50%),
      radial-gradient(1px 1px at 10% 60%, rgba(212,166,87,0.2) 0, transparent 50%);
    color: var(--text);
    font-family: 'Work Sans', -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
    padding-bottom: 80px;
  }

  h1, h2, .song-title{ font-family: 'Fraunces', Georgia, serif; }

  /* ---------- Hero ---------- */
  .hero{
    padding: 44px 20px 28px;
    max-width: 640px;
    margin: 0 auto;
    text-align: left;
  }
  .hero .eyebrow{
    color: var(--gold);
    font-size: 13px;
    letter-spacing: 0.02em;
    margin: 0 0 10px;
  }
  .hero h1{
    font-size: clamp(28px, 6vw, 40px);
    font-weight: 500;
    line-height: 1.15;
    margin: 0 0 12px;
  }
  .hero p{
    color: var(--muted);
    font-size: 15px;
    line-height: 1.6;
    margin: 0;
    max-width: 46ch;
  }

  /* ---------- Sticky nav ---------- */
  .nav{
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(16,20,42,0.92);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--line);
    padding: 10px 20px;
    display: flex;
    align-items: center;
    gap: 10px;
    max-width: 680px;
    margin: 0 auto;
  }
  .nav-tabs{
    display: flex;
    gap: 6px;
    flex: 1;
  }
  .nav-tab{
    background: transparent;
    border: 1px solid var(--line);
    color: var(--muted);
    font-family: inherit;
    font-size: 13px;
    padding: 8px 14px;
    border-radius: 999px;
    cursor: pointer;
    transition: color 0.15s, border-color 0.15s;
  }
  .nav-tab.active{
    color: var(--bg);
    background: var(--gold);
    border-color: var(--gold);
    font-weight: 600;
  }
  .nav-progress{
    font-size: 12px;
    color: var(--muted);
    white-space: nowrap;
  }
  .nav-progress strong{ color: var(--gold); }

  /* ---------- Sections ---------- */
  .part{
    max-width: 640px;
    margin: 0 auto;
    padding: 28px 20px 10px;
  }
  .part-title{
    font-size: 13px;
    text-transform: none;
    color: var(--gold);
    margin: 0 0 4px;
    font-weight: 600;
  }
  .part-sub{
    color: var(--muted);
    font-size: 13px;
    margin: 0 0 18px;
  }

  /* ---------- Song row ---------- */
  .song{
    border: 1px solid var(--line);
    border-radius: var(--radius);
    margin-bottom: 10px;
    overflow: hidden;
    background: var(--panel);
    transition: border-color 0.15s;
  }
  .song.done{ border-color: rgba(134,165,131,0.45); }

  .song-head{
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 14px 14px;
    cursor: pointer;
  }
  .song-num{
    font-family: 'Fraunces', serif;
    color: var(--gold-dim);
    font-size: 14px;
    width: 22px;
    flex-shrink: 0;
  }
  .song.done .song-num{ color: var(--done); }

  .song-main{ flex: 1; min-width: 0; }
  .song-title{
    font-size: 16px;
    font-weight: 500;
    line-height: 1.3;
    margin: 0 0 2px;
  }
  .song-meta{
    font-size: 12.5px;
    color: var(--muted);
    line-height: 1.4;
  }

  .song-check{
    flex-shrink: 0;
    width: 26px;
    height: 26px;
    border-radius: 50%;
    border: 1.5px solid var(--line);
    display: flex;
    align-items: center;
    justify-content: center;
    cursor: pointer;
    color: transparent;
    font-size: 14px;
    transition: all 0.15s;
  }
  .song.done .song-check{
    background: var(--done);
    border-color: var(--done);
    color: var(--bg);
  }

  .song-chevron{
    flex-shrink: 0;
    color: var(--muted);
    font-size: 12px;
    transition: transform 0.2s;
  }
  .song.open .song-chevron{ transform: rotate(180deg); }

  .song-body{
    max-height: 0;
    overflow: hidden;
    transition: max-height 0.25s ease;
    border-top: 1px solid transparent;
  }
  .song.open .song-body{
    border-top: 1px solid var(--line);
  }

  .song-media{ padding: 14px; }

  .video-wrap{
    position: relative;
    width: 100%;
    padding-top: 56.25%;
    border-radius: 8px;
    overflow: hidden;
    background: #000;
  }
  .video-wrap iframe{
    position: absolute;
    top:0; left:0; width:100%; height:100%;
    border: 0;
  }

  audio{
    width: 100%;
    height: 40px;
  }
  audio::-webkit-media-controls-panel{
    background: var(--panel-hi);
  }

  .media-tag{
    display: inline-block;
    font-size: 11px;
    color: var(--gold);
    border: 1px solid var(--gold-dim);
    border-radius: 4px;
    padding: 2px 7px;
    margin-bottom: 10px;
  }

  /* ---------- Transition rows (no media) ---------- */
  .song.plain{ background: transparent; border-style: dashed; }
  .song.plain .song-head{ cursor: default; }
  .song.plain .song-title{ color: var(--muted); font-style: italic; font-weight: 400; }
  .song.plain .song-chevron{ display: none; }

  footer{
    max-width: 640px;
    margin: 30px auto 0;
    padding: 0 20px;
    color: var(--muted);
    font-size: 12px;
    text-align: center;
  }
</style>
</head>
<body>

<header class="hero">
  <p class="eyebrow">Concert de Noël · programme gospel</p>
  <h1>Le set, dans l'ordre.</h1>
  <p>20 morceaux, deux parties. Touche un titre pour écouter la version de référence, coche-le une fois travaillé à la batterie.</p>
</header>

<nav class="nav">
  <div class="nav-tabs">
    <button class="nav-tab active" data-target="#partie1">Partie 1</button>
    <button class="nav-tab" data-target="#partie2">Partie 2</button>
  </div>
  <div class="nav-progress"><strong id="doneCount">0</strong>/20</div>
</nav>

<section class="part" id="partie1">
  <p class="part-title">Partie 1</p>
  <p class="part-sub">9 morceaux</p>
  <div class="songs" id="songs1"></div>
</section>

<section class="part" id="partie2">
  <p class="part-title">Partie 2</p>
  <p class="part-sub">11 morceaux</p>
  <div class="songs" id="songs2"></div>
</section>

<footer>Répétition personnelle — set list du groupe gospel</footer>

<script>
const DATA1 = [
  { id:1, title:"Intro + Oh holy night", meta:"G min + A# · intro", audio:"Intro.m4a" },
  { id:2, title:"O come all ye faithful", meta:"version Kirk Franklin · G#m", video:"pBLDd_brEjk" },
  { id:3, title:"Go tell it on the mountain", meta:"version Maverick City · A maj", video:"z1RpUV2AQ24" },
  { id:4, title:"Jesus oh what a wonderful child", meta:"version The Walls Group · D maj", video:"44CvlS1csK4" },
  { id:5, title:"Coventry carol", meta:"version Gospel Faith · F min", video:"WBs-IoQvhBI" },
  { id:6, title:"God rest ye merry gentlemen", meta:"version Robert Glasper & Cynthia Erivo (live) · D min", video:"O1jz7xw9OyQ" },
  { id:7, title:"Mary did you know", meta:"version Noble G · F min", audio:"Mary_did_you_know.m4a" },
  { id:8, title:"Interlude musicale", meta:"F min", plain:true },
  { id:9, title:"Afro christmas", meta:"version Joe Mettle · C maj", video:"UFQhHjcQUmU" },
];

const DATA2 = [
  { id:10, title:"Joyful joyful", meta:"Sister Act 2 · Db", video:"6Us9wOGOCLM" },
  { id:11, title:"The name of Jesus", meta:"version Maranda Curtis · Eb min", video:"qlN3IgQfs9M" },
  { id:12, title:"Promises", meta:"version Lisa Knowles · A maj", video:"FugV-gH7B1M" },
  { id:13, title:"I'll be home for christmas", meta:"A#", video:"4zJQOyEXUbs" },
  { id:14, title:"Have yourself a merry little christmas", meta:"version Whitney Houston · F maj", video:"7g79Ja0qjWU" },
  { id:15, title:"Hosanna", meta:"version Total Praise · G maj", video:"PdSchHT4BK0" },
  { id:16, title:"Amazing grace", meta:"version du groupe · D maj", audio:"AMazing-grace-version-du-groupe.mp3" },
  { id:17, title:"Compte les bienfaits de Dieu", meta:"version Samuel Joseph · F# maj", video:"J-NJTheJFc8" },
  { id:18, title:"Chanté Noël", meta:"", plain:true },
  { id:19, title:"Medley gospel traditionnel", meta:"Nobody knows the trouble I've seen · Soon and very soon · Let it shine · Swing low sweet chariot · Down by the riverside — version Gospel Faith · D maj", plain:true },
  { id:20, title:"Oh happy day", meta:"version Gospel Faith · C maj", audio:"happyday.mp3" },
];

const STORAGE_KEY = "gospel-set-progress";
function getProgress(){
  try{ return JSON.parse(localStorage.getItem(STORAGE_KEY)) || {}; }
  catch(e){ return {}; }
}
function saveProgress(p){ localStorage.setItem(STORAGE_KEY, JSON.stringify(p)); }

function renderSong(song){
  const el = document.createElement('div');
  el.className = 'song' + (song.plain ? ' plain' : '');
  el.id = 'song-' + song.id;

  let mediaHtml = '';
  if(song.video){
    mediaHtml = `<div class="song-media">
      <span class="media-tag">Vidéo</span>
      <div class="video-wrap"><iframe loading="lazy" src="https://www.youtube.com/embed/${song.video}" title="${song.title}" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture" allowfullscreen></iframe></div>
    </div>`;
  } else if(song.audio){
    mediaHtml = `<div class="song-media">
      <span class="media-tag">Audio</span>
      <audio controls preload="none" src="${song.audio}"></audio>
    </div>`;
  }

  el.innerHTML = `
    <div class="song-head">
      <span class="song-num">${song.id}</span>
      <div class="song-main">
        <p class="song-title">${song.title}</p>
        ${song.meta ? `<p class="song-meta">${song.meta}</p>` : ''}
      </div>
      ${!song.plain ? `<span class="song-chevron">▾</span>` : ''}
      <span class="song-check" data-id="${song.id}">✓</span>
    </div>
    ${!song.plain ? `<div class="song-body">${mediaHtml}</div>` : ''}
  `;

  if(!song.plain){
    el.querySelector('.song-head').addEventListener('click', (e) => {
      if(e.target.classList.contains('song-check')) return;
      el.classList.toggle('open');
      const body = el.querySelector('.song-body');
      body.style.maxHeight = el.classList.contains('open') ? body.scrollHeight + 'px' : '0px';
    });
  }

  el.querySelector('.song-check').addEventListener('click', (e) => {
    e.stopPropagation();
    const progress = getProgress();
    progress[song.id] = !progress[song.id];
    saveProgress(progress);
    applyDoneState(song.id, progress[song.id]);
    updateCounter();
  });

  return el;
}

function applyDoneState(id, done){
  const el = document.getElementById('song-' + id);
  if(el) el.classList.toggle('done', !!done);
}

function updateCounter(){
  const progress = getProgress();
  const count = Object.values(progress).filter(Boolean).length;
  document.getElementById('doneCount').textContent = count;
}

const songs1El = document.getElementById('songs1');
const songs2El = document.getElementById('songs2');
DATA1.forEach(s => songs1El.appendChild(renderSong(s)));
DATA2.forEach(s => songs2El.appendChild(renderSong(s)));

const progress = getProgress();
[...DATA1, ...DATA2].forEach(s => { if(progress[s.id]) applyDoneState(s.id, true); });
updateCounter();

// Nav tabs
const tabs = document.querySelectorAll('.nav-tab');
tabs.forEach(tab => {
  tab.addEventListener('click', () => {
    tabs.forEach(t => t.classList.remove('active'));
    tab.classList.add('active');
    document.querySelector(tab.dataset.target).scrollIntoView({ behavior: 'smooth', block: 'start' });
  });
});

// Highlight active tab on scroll
const sections = [document.getElementById('partie1'), document.getElementById('partie2')];
window.addEventListener('scroll', () => {
  const pos = window.scrollY + 100;
  let activeIdx = 0;
  sections.forEach((sec, i) => { if(sec.offsetTop <= pos) activeIdx = i; });
  tabs.forEach((t, i) => t.classList.toggle('active', i === activeIdx));
}, { passive: true });
</script>

</body>
</html>
