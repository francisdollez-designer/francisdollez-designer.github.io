<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Rubik's Cube 3D Animation</title>

<style>

* {
    box-sizing: border-box;
}

body {
    margin: 0;
    height: 100vh;
    display: flex;
    align-items: center;
    justify-content: center;
    background: transparent;
    overflow: hidden;
    font-family: Arial, sans-serif;
}


/* Zone 3D */
.scene {
    width: 300px;
    height: 300px;
    perspective: 900px;
}


/* Cube principal */
.cube {
    width: 150px;
    height: 150px;
    position: relative;
    margin: 75px auto;

    transform-style: preserve-3d;

    animation: rotateCube 12s infinite linear;
}


/* Rotation globale */
@keyframes rotateCube {

    from {
        transform:
            rotateX(-25deg)
            rotateY(0deg);
    }

    to {
        transform:
            rotateX(-25deg)
            rotateY(360deg);
    }
}


/* Petits cubes */
.cubie {

    position: absolute;

    width: 48px;
    height: 48px;

    transform-style: preserve-3d;

}


/* Faces */
.face {

    position: absolute;

    width: 48px;
    height: 48px;

    border: 2px solid #111;

    box-shadow:
        inset 0 0 8px rgba(0,0,0,.25);

}


/* Position des faces */
.front {
    transform:
        translateZ(24px);
}

.back {
    transform:
        rotateY(180deg)
        translateZ(24px);
}

.right {
    transform:
        rotateY(90deg)
        translateZ(24px);
}

.left {
    transform:
        rotateY(-90deg)
        translateZ(24px);
}

.top {
    transform:
        rotateX(90deg)
        translateZ(24px);
}

.bottom {
    transform:
        rotateX(-90deg)
        translateZ(24px);
}


/* Couleurs Rubik */
.red {
    background:#E92929;
}

.orange {
    background:#FF9A1F;
}

.blue {
    background:#0094FE;
}

.green {
    background:#08E326;
}

.yellow {
    background:#FFCC41;
}

.white {
    background:#FFFFFF;
}


</style>

</head>

<body>


<div class="scene">

    <div class="cube" id="cube"></div>

</div>



<script>


const cube = document.getElementById("cube");


const colors = [
    "red",
    "orange",
    "blue",
    "green",
    "yellow",
    "white"
];


let index = 0;


/*
Création des 27 petits cubes
*/

for(let x=-1;x<=1;x++){

    for(let y=-1;y<=1;y++){

        for(let z=-1;z<=1;z++){


            const cubie =
                document.createElement("div");


            cubie.className="cubie";


            cubie.style.transform =
            `
            translate3d(
                ${x*50}px,
                ${y*50}px,
                ${z*50}px
            )
            `;


            [
                "front",
                "back",
                "right",
                "left",
                "top",
                "bottom"

            ].forEach(faceName=>{


                const face =
                document.createElement("div");


                face.className =
                "face "+faceName;


                face.classList.add(
                    colors[index % colors.length]
                );


                cubie.appendChild(face);


            });


            cube.appendChild(cubie);

            index++;

        }

    }

}


</script>


</body>
</html>
